<style>
    #previewModal .modal-dialog {
        max-width: 100%;
        height: 100%;
        margin: 0;
    }
    #previewModal .modal-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #previewModal .modal-body {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }
    #filePreviewContainer {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }
    #filePreviewContainer img, #filePreviewContainer iframe {
        max-width: 100%;
        max-height: 100%;
        margin: auto;
    }
</style>

<div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="filePreviewContainer"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="prevFile">&lt;</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                <button type="button" class="btn btn-primary" id="nextFile">&gt;</button>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        var files = [];
        var types = [];
        $('.file-preview').each(function() {
            files.push($(this).data('file'));
            types.push($(this).data('type'));
        });

        var currentIndex = 0;

        function showFile(index) {
            var file = files[index];
            var type = types[index];
            var container = $('#filePreviewContainer');
            container.empty();

            if (type === 'image') {
                    container.append('<img src="' + file + '" class="img-fluid" alt="Предварительный просмотр файла">');
            } else if (type === 'pdf') {
                    container.append('<iframe src="' + file + '" width="100%" height="100%"></iframe>');
            }

            $('#previewModal').modal('show');
        }

        $('.file-preview').on('click', function(event) {
            event.preventDefault();
            currentIndex = files.indexOf($(this).data('file'));
            showFile(currentIndex);
        });

        $('#prevFile').on('click', function() {
            currentIndex = (currentIndex - 1 + files.length) % files.length;
            showFile(currentIndex);
        });

        $('#nextFile').on('click', function() {
            currentIndex = (currentIndex + 1) % files.length;
            showFile(currentIndex);
        });
    });
</script>
